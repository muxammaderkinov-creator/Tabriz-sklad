<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabriz sklad — Учёт и Продажи</title>
    <style>
        /* Стиль приложения в стиле SQL Terminal / Admin */
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #282a36;
            --accent-color: #50fa7b;
            --text-color: #f8f8f2;
            --border-color: #44475a;
            --warning-color: #ff5555;
            --blue-color: #8be9fd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Segoe UI', monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        h1, h2 {
            color: var(--blue-color);
            margin-bottom: 15px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background-color: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: var(--blue-color);
        }

        input, select {
            background-color: #191a21;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            outline: none;
            font-size: 0.9rem;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* Таблица контроля остатка */
        .table-container {
            overflow-x: auto;
            background-color: var(--panel-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            background-color: #191a21;
            color: var(--blue-color);
        }

        .img-preview {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .badge-warning {
            color: var(--warning-color);
            font-weight: bold;
        }

        .badge-success {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* Брендинг */
        .footer-branding {
            position: fixed;
            bottom: 10px;
            right: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--accent-color);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <h1>> TABRIZ SKLAD: Добавление и Контроль Продаж</h1>

    <div class="container">
        
        <!-- ФОРМА 1: ДОБАВЛЕНИЕ ИЛИ ЗАКУПКА ТОВАРА -->
        <div class="panel">
            <h2>➕ Добавление / Пополнение товара</h2>
            <form onsubmit="addProduct(event)">
                <div class="form-group">
                    <label>Наименование товара / материала:</label>
                    <input type="text" id="add-name" required placeholder="например: ЛДСП 18мм Белый">
                </div>
                
                <div class="form-group">
                    <label>Категория:</label>
                    <select id="add-cat">
                        <option value="Плитные материалы">Плитные материалы (ЛДСП/МДФ)</option>
                        <option value="Фурнитура">Фурнитура и Петли</option>
                        <option value="Направляющие">Направляющие</option>
                        <option value="Кромка">Кромка и профили</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Цена продажи (UZS):</label>
                    <input type="number" id="add-price" required placeholder="180000">
                </div>

                <div class="form-group">
                    <label>Количество (для прихода на склад):</label>
                    <input type="number" id="add-qty" min="1" required placeholder="50">
                </div>

                <div class="form-group">
                    <label>Ссылка на фото (URL):</label>
                    <input type="text" id="add-img" placeholder="https://..." value="https://via.placeholder.com/80">
                </div>

                <button type="submit" class="btn">> СОХРАНИТЬ НА СКЛАД</button>
            </form>
        </div>

        <!-- ФОРМА 2: ОФОРМЛЕНИЕ ПРОДАЖИ -->
        <div class="panel">
            <h2>🛒 Оформление продажи</h2>
            <form onsubmit="sellProduct(event)">
                <div class="form-group">
                    <label>Выберите товар со склада:</label>
                    <select id="sell-select" required></select>
                </div>

                <div class="form-group">
                    <label>Количество к продаже:</label>
                    <input type="number" id="sell-qty" min="1" value="1" required>
                </div>

                <button type="submit" class="btn" style="background-color: var(--blue-color);">> СПИСАТЬ И ЗАРЕГИСТРИРОВАТЬ</button>
            </form>
        </div>

    </div>

    <!-- ТАБЛИЦА КОНТРОЛЯ ОСТАТКОВ И ПРОДАЖ -->
    <h2>📊 Контроль остатка и проданных товаров</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Фото</th>
                    <th>ID</th>
                    <th>Наименование товара</th>
                    <th>Категория</th>
                    <th>Цена продажи</th>
                    <th>Остаток на складе</th>
                    <th>Продано (Всего)</th>
                </tr>
            </thead>
            <tbody id="inventory-table">
                <!-- Строки формируются автоматически -->
            </tbody>
        </table>
    </div>

    <div class="footer-branding">MUSTAFAYEV ACADEMY</div>

    <script>
        // Инициализация базы данных в памяти браузера
        let inventory = JSON.parse(localStorage.getItem('tabriz_inventory')) || [
            {
                id: 'PROD_1',
                name: 'ЛДСП 18мм Белый Базовый',
                category: 'Плитные материалы',
                price: 180000,
                stock: 40,
                sold: 10,
                img: 'https://via.placeholder.com/80'
            },
            {
                id: 'PROD_2',
                name: 'Петля накладная с доводчиком',
                category: 'Фурнитура',
                price: 8500,
                stock: 250,
                sold: 50,
                img: 'https://via.placeholder.com/80'
            }
        ];

        // Функция сохранения данных
        function saveData() {
            localStorage.setItem('tabriz_inventory', JSON.stringify(inventory));
            renderUI();
        }

        // Функция добавления/пополнения товара
        function addProduct(e) {
            e.preventDefault();

            const name = document.getElementById('add-name').value;
            const category = document.getElementById('add-cat').value;
            const price = Number(document.getElementById('add-price').value);
            const qty = Number(document.getElementById('add-qty').value);
            const img = document.getElementById('add-img').value || 'https://via.placeholder.com/80';

            // Проверяем, есть ли уже такой товар на складе
            let existingItem = inventory.find(item => item.name.toLowerCase() === name.toLowerCase());

            if (existingItem) {
                // Если есть — увеличиваем остаток
                existingItem.stock += qty;
                existingItem.price = price;
                alert(`Количество товара "${name}" успешно пополнено на +${qty} шт.`);
            } else {
                // Если нет — добавляем новую позицию
                inventory.push({
                    id: 'PROD_' + Date.now(),
                    name: name,
                    category: category,
                    price: price,
                    stock: qty,
                    sold: 0,
                    img: img
                });
                alert(`Новый товар "${name}" добавлен на склад!`);
            }

            e.target.reset();
            saveData();
        }

        // Функция оформления продажи и контроля остатка
        function sellProduct(e) {
            e.preventDefault();

            const productId = document.getElementById('sell-select').value;
            const requestedQty = Number(document.getElementById('sell-qty').value);

            let product = inventory.find(item => item.id === productId);

            if (!product) {
                alert('Ошибка: Товар не найден!');
                return;
            }

            // КОНТРОЛЬ: Проверяем наличие требуемого количества
            if (product.stock < requestedQty) {
                alert(`⚠️ Недостаточно товара на складе!\nДоступно: ${product.stock} шт.\nЗапрошено: ${requestedQty} шт.`);
                return;
            }

            // СПИСАНИЕ СО СКЛАДА И УЧЁТ ПРОДАЖ
            product.stock -= requestedQty;
            product.sold += requestedQty;

            alert(`✅ Продажа успешно оформлена!\nПродано: ${requestedQty} шт.\nОстаток на складе: ${product.stock} шт.`);
            saveData();
        }

        // Отрисовка таблицы и списка выбора
        function renderUI() {
            const tbody = document.getElementById('inventory-table');
            const select = document.getElementById('sell-select');

            tbody.innerHTML = '';
            select.innerHTML = '';

            inventory.forEach(item => {
                // Добавляем строку в таблицу контроля
                const stockBadge = item.stock < 5 
                    ? `<span class="badge-warning">${item.stock} шт (Мало)</span>` 
                    : `<span class="badge-success">${item.stock} шт</span>`;

                tbody.innerHTML += `
                    <tr>
                        <td><img src="${item.img}" class="img-preview" alt="фото"></td>
                        <td>#${item.id}</td>
                        <td><b>${item.name}</b></td>
                        <td>${item.category}</td>
                        <td>${item.price.toLocaleString()} UZS</td>
                        <td>${stockBadge}</td>
                        <td style="color: var(--blue-color); font-weight: bold;">${item.sold} шт</td>
                    </tr>
                `;

                // Заполняем выпадающий список выбора товара для продажи
                select.innerHTML += `
                    <option value="${item.id}">${item.name} (Остаток: ${item.stock} шт)</option>
                `;
            });
        }

        // Инициализация отображения при загрузке страницы
        renderUI();
    </script>
</body>
</html>
